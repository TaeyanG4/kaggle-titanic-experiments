name: Verify publication artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check evidence, hashes and documentation
        run: python tools/verify_publication.py
      - name: Reconstruct frozen final artifact
        run: python tools/replay_final_artifact.py --output replayed_v47.csv
